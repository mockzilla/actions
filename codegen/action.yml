name: Mockzilla Codegen
description: Builds and publishes a codegen server to Mockzilla

outputs:
  url:
    description: The live simulation URL
    value: ${{ steps.publish.outputs.url }}

inputs:
  token:
    description: GITHUB_TOKEN for repo identity verification
    required: true
  region:
    description: |
      Preferred AWS region for your Mockzilla simulation (e.g. us-east-1, ap-southeast-1).
      Used as a hint on first deploy only. If the region or its area is at capacity,
      the nearest available region is used instead. Has no effect after the Mockzilla
      simulation is already deployed. Optional.
    required: false
    default: ''
  environment:
    description: JSON object of environment variables to set in the simulation (e.g. '{"ENV":"production","DEBUG":"true"}').
    required: false
    default: ''
  host:
    description: API host for the simulation URL (api.mockzilla.org, api.mockzilla.de, or api.mockzilla.net). Defaults to the org setting.
    required: false
    default: ''
  basic-auth-user:
    description: Username for HTTP Basic Auth on the API Explorer UI. Set together with basic-auth-password. Empty leaves the UI open.
    required: false
    default: ''
  basic-auth-password:
    description: Password for the API Explorer Basic Auth. Pass a GitHub secret. Stored hashed, never logged.
    required: false
    default: ''
  allowed-ips:
    description: 'JSON array of CIDRs allowed to reach this simulation (UI and API). Requires the IP allowlist feature; ignored if not enabled for your organization. Example: ["203.0.113.0/24", "192.168.1.1"].'
    required: false
    default: ''
  timeout-minutes:
    description: Maximum minutes to wait for the simulation to become active.
    required: false
    default: '5'
  delete:
    description: |
      Remove this repository from Mockzilla. When set to 'true', the
      action skips publishing and deletes all mock APIs for this repo.
      Useful on the free plan to free up your slot before connecting a
      different repository.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: publish
      id: publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        REF: ${{ github.head_ref || github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PREFERRED_REGION: ${{ inputs.region }}
        ENVIRONMENT: ${{ inputs.environment }}
        HOST: ${{ inputs.host }}
        BASIC_AUTH_USER: ${{ inputs.basic-auth-user }}
        BASIC_AUTH_PASSWORD: ${{ inputs.basic-auth-password }}
        ALLOWED_IPS: ${{ inputs.allowed-ips }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        DELETE: ${{ inputs.delete }}
      run: |
        source "$GITHUB_ACTION_PATH/../shared/functions.sh"

        if [ "$DELETE" = "true" ]; then
          handle_delete "codegen"
        fi

        if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "closed" ]; then
          handle_teardown "codegen"
        fi

        if [ ! -f "go.mod" ]; then
          post_error "codegen action requires go.mod in the repository root"
          exit 1
        fi

        echo "Building server binary..."
        GOARCH=arm64 GOOS=linux go build -o /tmp/mockzilla-server ./cmd/server || {
          post_error "Server build failed"
          exit 1
        }

        # Service names from the generated import list, shipped to ingest so the
        # app can show the catalog without hitting the binary's /.services (which
        # 404s when the UI is disabled). Best-effort: [] if the file is absent.
        echo "Extracting service list..."
        SERVICES_JSON=$(grep -oE '/pkg/[a-z0-9_]+"' cmd/server/services_gen.go 2>/dev/null \
          | sed 's#/pkg/##; s#"##' | sort -u | jq -R . | jq -cs .)
        export SERVICES_JSON

        echo "Registering upload..."
        register_upload "codegen"

        echo "Uploading server binary..."
        curl -sf -X PUT "$UPLOAD_URL" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @/tmp/mockzilla-server || {
            post_error "Binary upload failed - your Mockzilla simulation was not updated"
            exit 1
          }

        poll_status
