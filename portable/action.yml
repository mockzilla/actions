name: Mockzilla Portable
description: Publishes per-service OpenAPI/static mocks to Mockzilla

outputs:
  url:
    description: The live simulation URL
    value: ${{ steps.publish.outputs.url }}

inputs:
  token:
    description: GITHUB_TOKEN for repo identity verification
    required: true
  region:
    description: |
      Preferred AWS region for your Mockzilla simulation (e.g. us-east-1, ap-southeast-1).
      Used as a hint on first deploy only. If the region or its area is at capacity,
      the nearest available region is used instead. Has no effect after the Mockzilla
      simulation is already deployed. Optional.
    required: false
    default: ''
  memory-size:
    description: Memory allocated to the simulation in megabytes (e.g. 128, 256, 512).
    required: false
    default: '128'
  timeout:
    description: Request timeout for the simulation in seconds (e.g. 30, 60).
    required: false
    default: ''
  environment:
    description: JSON object of environment variables to set in the simulation (e.g. '{"ENV":"production","DEBUG":"true"}').
    required: false
    default: ''
  host:
    description: API host for the simulation URL (api.mockzilla.org, api.mockzilla.de, or api.mockzilla.net). Defaults to the org setting.
    required: false
    default: ''
  services-dir:
    description: |
      Directory containing per-service folders. Each `<services-dir>/<name>/`
      becomes one service. A service folder can contain an OpenAPI spec
      (any *.{yml,yaml,json}, with `openapi.{yml,yaml,json}` as the
      canonical name when multiple specs are present), an optional
      config.yml (latency / errors / mount / upstream / cache), an optional
      context.yml (flat replacement values), and an optional static/
      directory for canned responses. Defaults to 'services'.
    required: false
    default: 'services'
  timeout-minutes:
    description: Maximum minutes to wait for the simulation to become active.
    required: false
    default: '5'
  delete:
    description: |
      Remove this repository from Mockzilla. When set to 'true', the
      action skips publishing and deletes all mock APIs for this repo.
      Useful on the free plan to free up your slot before connecting a
      different repository.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: publish
      id: publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        REF: ${{ github.head_ref || github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PREFERRED_REGION: ${{ inputs.region }}
        MEMORY_SIZE: ${{ inputs.memory-size }}
        TIMEOUT: ${{ inputs.timeout }}
        ENVIRONMENT: ${{ inputs.environment }}
        HOST: ${{ inputs.host }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        SERVICES_DIR: ${{ inputs.services-dir }}
        DELETE: ${{ inputs.delete }}
      run: |
        source "$GITHUB_ACTION_PATH/../shared/functions.sh"

        if [ "$DELETE" = "true" ]; then
          handle_delete "portable"
        fi

        if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "closed" ]; then
          handle_teardown "portable"
        fi

        SERVICES_DIR="${SERVICES_DIR%/}"
        if [ ! -d "$SERVICES_DIR" ]; then
          echo "::warning::Nothing to publish - no '${SERVICES_DIR}/' directory found"
          exit 0
        fi

        # The runtime expects the services tree at a fixed in-archive path
        # (`services/`). Rewrite the on-disk dir name if the user picked
        # something else.
        TAR_TRANSFORM=""
        if [ "$SERVICES_DIR" != "services" ]; then
          TAR_TRANSFORM="--transform=s|^${SERVICES_DIR}|services|"
        fi

        TAR_ARGS="$SERVICES_DIR"
        [ -f app.yml ] && TAR_ARGS="$TAR_ARGS app.yml"

        echo "Packing services..."
        tar -czf /tmp/mockzilla-specs.tar.gz $TAR_TRANSFORM $TAR_ARGS

        echo "Registering upload..."
        register_upload "portable"

        echo "Uploading specs..."
        curl -sf -X PUT "$UPLOAD_URL" \
          -H "Content-Type: application/gzip" \
          --data-binary @/tmp/mockzilla-specs.tar.gz || {
            post_error "Spec upload failed - your Mockzilla simulation was not updated"
            exit 1
          }

        poll_status
